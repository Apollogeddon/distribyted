<!DOCTYPE html>
<html lang="en">

<head>
    {{template "header.html" .Title}}
</head>

<body class="header-fixed sidebar-fixed sidebar-dark header-dark" id="body">
    <div class="wrapper">
        {{template "navbar.html" "routes"}}

        <div class="page-wrapper">
            <header class="main-header" id="header">
                <nav class="navbar navbar-static-top navbar-expand-lg">
                    <button id="sidebar-toggler" class="sidebar-toggle">
                        <span class="sr-only">Toggle navigation</span>
                    </button>
                </nav>
            </header>

            <div class="content-wrapper">
                <main class="content">
                    {{template "offline-banner"}}

                    <div class="page-header">
                        <div>
                            <h1>Routes</h1>
                            <p class="page-subtitle">Each route is a folder of torrents in every mount.</p>
                        </div>
                        <button type="button" class="btn btn-primary btn-lg-touch" data-open-dialog="add-magnet">
                            <i class="mdi mdi-plus" aria-hidden="true"></i> Add magnet
                        </button>
                    </div>

                    {{template "routes-table" .}}
                </main>
            </div>
        </div>
    </div>

    <dialog id="add-magnet" class="app-dialog" aria-labelledby="add-magnet-title">
        <div class="app-dialog-header">
            <h2 id="add-magnet-title">Add a magnet</h2>
            <button type="button" class="btn-icon" data-close-dialog aria-label="Close"><i class="mdi mdi-close" aria-hidden="true"></i></button>
        </div>
        {{template "add-magnet-form" .Form}}
    </dialog>

    {{template "footer.html"}}
</body>

</html>

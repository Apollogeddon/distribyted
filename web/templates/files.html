<!DOCTYPE html>
<html lang="en">

<head>
    {{template "header.html" .Title}}
</head>

<body class="header-fixed sidebar-fixed sidebar-dark header-dark" id="body">
    <div class="wrapper">
        {{template "navbar.html" "files"}}

        <div class="page-wrapper">
            <header class="main-header" id="header">
                <nav class="navbar navbar-static-top navbar-expand-lg">
                    <button id="sidebar-toggler" class="sidebar-toggle">
                        <span class="sr-only">Toggle navigation</span>
                    </button>
                </nav>
            </header>

            <div class="content-wrapper">
                <main class="content">
                    {{template "offline-banner"}}

                    <div class="page-header">
                        <div>
                            <h1>Files</h1>
                            <p class="page-subtitle">Everything the mounts show: each route's torrents, and the folders and links you add.</p>
                        </div>
                    </div>

                    {{template "files-view" .}}
                </main>
            </div>
        </div>
    </div>

    <dialog id="file-dialog" class="app-dialog" aria-labelledby="file-dialog-title">
        <div id="file-dialog-body"></div>
    </dialog>

    {{template "footer.html"}}
</body>

</html>

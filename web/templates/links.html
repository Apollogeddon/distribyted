<!DOCTYPE html>
<html lang="en">

<head>
    {{template "header.html" .Title}}
</head>

<body class="header-fixed sidebar-fixed sidebar-dark header-dark" id="body">
    <div class="wrapper">
        {{template "navbar.html" "links"}}

        <div class="page-wrapper">
            <header class="main-header" id="header">
                <nav class="navbar navbar-static-top navbar-expand-lg">
                    <button id="sidebar-toggler" class="sidebar-toggle">
                        <span class="sr-only">Toggle navigation</span>
                    </button>
                </nav>
            </header>

            <div class="content-wrapper">
                <main class="content">
                    {{template "offline-banner"}}

                    <div class="page-header">
                        <div>
                            <h1>Links</h1>
                            <p class="page-subtitle">A link shows a file at a second path, such as a film filed the way your library names it.</p>
                        </div>
                        <button type="button" class="btn btn-primary" data-open-dialog="add-link">
                            <i class="mdi mdi-plus" aria-hidden="true"></i> Add link
                        </button>
                    </div>

                    {{template "links-list" .}}
                </main>
            </div>
        </div>
    </div>

    <dialog id="add-link" class="app-dialog" aria-labelledby="add-link-title">
        <div class="app-dialog-header">
            <h2 id="add-link-title">Add a link</h2>
            <button type="button" class="btn-icon" data-close-dialog aria-label="Close"><i class="mdi mdi-close" aria-hidden="true"></i></button>
        </div>
        {{template "link-form" .Form}}
    </dialog>

    {{template "footer.html"}}
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    {{template "header.html" .Title}}
</head>

<body class="header-fixed sidebar-fixed sidebar-dark header-dark" id="body">
    <div class="wrapper">
        {{template "navbar.html" "served-folders"}}

        <div class="page-wrapper">
            <header class="main-header" id="header">
                <nav class="navbar navbar-static-top navbar-expand-lg">
                    <button id="sidebar-toggler" class="sidebar-toggle">
                        <span class="sr-only">Toggle navigation</span>
                    </button>
                </nav>
            </header>

            <div class="content-wrapper">
                <main class="content">
                    {{template "offline-banner"}}

                    <div class="page-header">
                        <div>
                            <h1>Servers</h1>
                            <p class="page-subtitle">Folders on this machine shared as torrents. Each one's magnet link follows its contents.</p>
                        </div>
                    </div>

                    {{template "servers-list" .}}
                </main>
            </div>
        </div>
    </div>

    {{template "footer.html"}}
</body>

</html>

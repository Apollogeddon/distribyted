{{define "dashboard-stats"}}
<section id="stats" class="kpis" aria-label="Current figures"
    data-down="{{.DownRate}}" data-up="{{.UpRate}}"
    hx-get="/dashboard/stats"
    hx-trigger="every 2s [document.visibilityState === 'visible']"
    hx-swap="morph:outerHTML" hx-ext="morph">
    <div class="card kpi">
        <i class="mdi mdi-arrow-down-bold kpi-icon kpi-down" aria-hidden="true"></i>
        <p class="kpi-label">Download</p>
        <p class="kpi-figure">{{.Down}}</p>
    </div>
    <div class="card kpi">
        <i class="mdi mdi-arrow-up-bold kpi-icon kpi-up" aria-hidden="true"></i>
        <p class="kpi-label">Upload</p>
        <p class="kpi-figure">{{.Up}}</p>
    </div>
    <div class="card kpi kpi-wide">
        <i class="mdi mdi-database-outline kpi-icon kpi-cache" aria-hidden="true"></i>
        <p class="kpi-label">Piece cache</p>
        {{if .HasCache}}
        <p class="kpi-figure">{{.CachePercent}}% <span class="kpi-sub">{{.CacheUsed}} of {{.CacheCapacity}} · {{.CacheItems}} files</span></p>
        <div class="meter" role="meter" aria-label="Piece cache used" aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{.CachePercent}}">
            <span style="width: {{.CacheWidth}}"></span>
        </div>
        {{else}}
        <p class="kpi-figure kpi-none">Not in use</p>
        {{end}}
    </div>
</section>
{{end}}

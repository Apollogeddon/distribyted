<!DOCTYPE html>
<html lang="en">

<head>
  {{template "header.html" "Login"}}
</head>

<body class="header-fixed sidebar-fixed sidebar-dark header-dark" id="body">
  <div class="d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="card card-default" style="width: 100%; max-width: 360px;">
      <div class="card-header justify-content-center">
        <h1 class="login-title">Distribyted</h1>
      </div>
      <div class="card-body">
        {{if .Error}}
        <div class="alert alert-danger" role="alert">Invalid username or password.</div>
        {{end}}
        {{if .TooMany}}
        <div class="alert alert-danger" role="alert">Too many failed logins. Please wait a minute and try again.</div>
        {{end}}
        <form method="post" action="/login">
          <input type="hidden" name="next" value="{{.Next}}">
          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" class="form-control" id="username" name="username" autocomplete="username" autofocus required>
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" class="form-control" id="password" name="password" autocomplete="current-password" required>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Log in</button>
        </form>
      </div>
    </div>
  </div>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    {{template "header.html" .Title}}
</head>

<body class="header-fixed sidebar-fixed sidebar-dark header-dark" id="body">
    <div class="wrapper">
        {{template "navbar.html" "dashboard"}}

        <div class="page-wrapper">
            <header class="main-header" id="header">
                <nav class="navbar navbar-static-top navbar-expand-lg">
                    <button id="sidebar-toggler" class="sidebar-toggle" aria-controls="sidebar" aria-expanded="false">
                        <span class="sr-only">Menu</span>
                    </button>
                </nav>
            </header>

            <div class="content-wrapper">
                <main class="content">
                    {{template "offline-banner"}}

                    <div class="page-header">
                        <div>
                            <h1>Dashboard</h1>
                            <p class="page-subtitle">Transfer across every torrent, and how full the piece cache is.</p>
                        </div>
                    </div>

                    {{template "dashboard-stats" .Stats}}

                    <section class="card chart-card" aria-labelledby="speed-title">
                        <header class="route-card-header">
                            <h2 id="speed-title">Speed, last minute</h2>
                            <ul class="chart-legend">
                                <li><span class="swatch swatch-down" aria-hidden="true"></span> Download</li>
                                <li><span class="swatch swatch-up" aria-hidden="true"></span> Upload</li>
                            </ul>
                        </header>
                        <div class="chart-body">
                            <canvas id="speed-chart" role="img" aria-label="Download and upload speed over the last minute. The figures above show the current speeds."></canvas>
                        </div>
                    </section>
                </main>
            </div>
        </div>
    </div>

    {{template "footer.html"}}
    <script src="/assets/plugins/charts/Chart.min.js"></script>
    <script src="/assets/js/dashboard.js"></script>
</body>

</html>

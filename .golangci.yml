# Generated by forgego from .forgego/golangci.yml and .golangci.local.yml.
# Don't edit it: change .golangci.local.yml, then run `task sync`.
version: "2"
run:
  timeout: 5m
linters:
  # errcheck, govet, ineffassign, staticcheck and unused
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nilerr
    - revive
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign
    - errcheck
    - forbidigo
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
        - name: var-naming
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (io.ReadCloser).Close
        - (*os.File).Close
    gosec:
      excludes:
        - G304
        - G115
    forbidigo:
      forbid:
        - pattern: 'fmt\.Print(ln|f)?'
          msg: "use zerolog structured logger instead of fmt.Print*"
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - gosec
          - unparam
      # Don't enforce errcheck/gosec in test files
      - path: _test\.go
        linters:
          - errcheck
          - gosec
      # testenv helpers are test infrastructure only
      - path: internal/testenv
        linters:
          - errcheck
          - gosec
formatters:
  enable:
    - gofumpt
    - goimports
issues:
  max-issues-per-linter: 0
  max-same-issues: 0

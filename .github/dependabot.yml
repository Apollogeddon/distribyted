version: 2
# Every update waits 3 days after a version is published before it's proposed, so a
# compromised release has time to be caught and yanked upstream first.
updates:
  # 1. GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    groups:
      actions-dependencies:
        patterns:
          - "*"
        update-types:
          - "major"
          - "minor"
          - "patch"
    # CI deliberately tracks forgego's reusable workflows at @main.
    ignore:
      - dependency-name: "apollogeddon/forgego"

  # 2. Go Modules
  # /tools/templ pins the templ generator; the runtime in / must match it
  # (TestTemplVersionsMatch), so the two are grouped into one PR.
  - package-ecosystem: "gomod"
    directories:
      - "/"
      - "/tools/templ"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
    pull-request-branch-name:
      separator: "-"
    labels:
      - "dependencies"
      - "go"
    groups:
      templ:
        patterns:
          - "github.com/a-h/templ*"
      go-non-major:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # v2.11.0+ reintroduces a github.com/RoaringBitmap/roaring v1/v2 type
      # conflict with github.com/anacrolix/torrent (see 11a99ce). Pinned to
      # v2.10.0 until torrent/roaring versions are reconciled upstream.
      - dependency-name: "github.com/anacrolix/missinggo/v2"
        versions: [">2.10.0"]

  # The documentation site is its own module: its go.mod holds the Hextra theme
  - package-ecosystem: "gomod"
    directory: "/docs"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    labels:
      - "dependencies"
    groups:
      docs:
        patterns:
          - "*"
    commit-message:
      prefix: "docs(deps)"

  # 3. Docker (the image)
  # forgego's pin: proposed daily and without the cooldown, as we publish it. Only forgego
  # itself, which a tool line makes an indirect require; it brings its own dependencies.
  - package-ecosystem: "gomod"
    directories:
      - "/.forgego/forgego"
      - "/docs/.forgego/forgego"
    schedule:
      interval: "daily"
    groups:
      forgego:
        patterns: ["*"]
    allow:
      - dependency-name: "github.com/apollogeddon/forgego"
        dependency-type: "all"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "docker"
    directory: "/build"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    labels:
      - "docker"
    groups:
      non-major:
        update-types:
          - "minor"
          - "patch"

  # 4. Docker (Tools)
  - package-ecosystem: "docker"
    directory: "/build/tools"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    labels:
      - "docker"
      - "tools"
    groups:
      non-major:
        update-types:
          - "minor"
          - "patch"

version: 2
updates:
  # 1. GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-dependencies:
        patterns:
          - "*"
        update-types:
          - "major"
          - "minor"
          - "patch"

  # 2. Go Modules
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    pull-request-branch-name:
      separator: "-"
    labels:
      - "dependencies"
      - "go"
    groups:
      go-non-major:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # v2.11.0+ reintroduces a github.com/RoaringBitmap/roaring v1/v2 type
      # conflict with github.com/anacrolix/torrent (see 11a99ce). Pinned to
      # v2.10.0 until torrent/roaring versions are reconciled upstream.
      - dependency-name: "github.com/anacrolix/missinggo/v2"
        versions: [">2.10.0"]

  # 3. Docker (Root)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "docker"
    groups:
      non-major:
        update-types:
          - "minor"
          - "patch"

  # 4. Docker (Tools)
  - package-ecosystem: "docker"
    directory: "/tools"
    schedule:
      interval: "weekly"
    labels:
      - "docker"
      - "tools"
    groups:
      non-major:
        update-types:
          - "minor"
          - "patch"

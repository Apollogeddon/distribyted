---
name: build

on:
  workflow_call:
    inputs:
      release_tag:
        description: "Build this release's tag and attach the binaries to it, skipping the tests that already ran on the commit"
        type: string
        required: false
        default: ''

jobs:
  # Linux is tested and built for pull requests and main by forgego's testing workflow in the
  # pipeline; it's built here only for a release, beside the platforms that workflow can't build.
  build:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        job_name: ${{ fromJSON(inputs.release_tag == '' && '["mac", "windows_amd64"]' || '["linux_amd64", "mac", "windows_amd64"]') }}
        # linux_amd64 has no entry, as an entry for a platform left out of job_name would add it back;
        # it takes the ubuntu-latest and linux defaults below
        include:
          - job_name: mac
            os: macos-latest
            go_os: darwin
            go_arch: amd64

          - job_name: windows_amd64
            os: windows-latest
            go_os: windows
            go_arch: amd64

    name: ${{ matrix.job_name }}
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # the tag, when building a release, so git describe names the binaries after it
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      # only a release builds Linux here, so it needs only what cgofuse compiles against
      - name: Install Libraries on Linux
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fuse libfuse-dev pkg-config
        if: matrix.job_name == 'linux_amd64'

      - name: Install Libraries on macOS
        shell: bash
        run: |
          brew update
          brew install --cask macfuse
        if: matrix.job_name == 'mac'

      - name: Install Libraries on Windows
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ProgressPreference = 'SilentlyContinue'

          function Install-WingetPackage($id) {
            $maxAttempts = 5
            for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
              # --exact avoids winget's fuzzy id matching picking an
              # unrelated/beta package (e.g. WinFsp.WinFsp.Beta) instead of
              # the pinned id below.
              winget install --exact --id $id --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity
              if ($LASTEXITCODE -eq 0) { return }
              if ($attempt -eq $maxAttempts) {
                Write-Error "winget install $id failed after $maxAttempts attempts (exit $LASTEXITCODE)"
                exit $LASTEXITCODE
              }
              $delay = 10 * $attempt
              Write-Warning "winget install $id failed (attempt $attempt/$maxAttempts, exit $LASTEXITCODE); retrying in ${delay}s..."
              Start-Sleep -Seconds $delay
            }
          }

          # WinFsp is installed from its official MSI directly, not via
          # winget: winget's silent install runs the MSI at its *default*
          # install level, which skips the "Developer" feature that ships
          # the fuse/*.h headers cgofuse needs to compile. The package
          # "installs" successfully either way — the gap only shows up much
          # later as a cryptic CGo "fuse_common.h: No such file or
          # directory" error, since CPATH below is (and was) pointing at
          # the right directory all along; the headers just were never
          # copied there. INSTALLLEVEL=1000 forces every MSI feature,
          # matching how winfsp/cgofuse's own CI installs WinFsp to build
          # and test this exact library (see its
          # .github/workflows/test.yml). Retried like Install-WingetPackage
          # above, for the same reason that function exists: transient
          # download/install failures on hosted runners.
          function Install-WinFsp {
            $maxAttempts = 5
            for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
              try {
                $headers = @{ Authorization = "token $env:GITHUB_TOKEN" }
                $release = Invoke-RestMethod -Uri 'https://api.github.com/repos/winfsp/winfsp/releases/latest' -Headers $headers
                $msiUrl = ($release.assets | Where-Object { $_.name -match '^winfsp-.*\.msi$' } | Select-Object -First 1).browser_download_url
                if (-not $msiUrl) { throw "no winfsp-*.msi asset found on release $($release.tag_name)" }

                $msiPath = Join-Path $env:RUNNER_TEMP 'winfsp.msi'
                Invoke-WebRequest -Uri $msiUrl -OutFile $msiPath

                $proc = Start-Process -FilePath msiexec.exe -ArgumentList "/i `"$msiPath`" /qn INSTALLLEVEL=1000" -Wait -PassThru
                if ($proc.ExitCode -ne 0) { throw "msiexec exited $($proc.ExitCode)" }

                # Fail fast here with a clear message rather than let a
                # missing header surface as an unrelated-looking CGo error
                # in a much later build step.
                $header = 'C:\Program Files (x86)\WinFsp\inc\fuse\fuse_common.h'
                if (-not (Test-Path $header)) { throw "WinFsp installed but $header is still missing" }
                return
              } catch {
                if ($attempt -eq $maxAttempts) {
                  Write-Error "installing WinFsp failed after $maxAttempts attempts: $_"
                  exit 1
                }
                $delay = 10 * $attempt
                Write-Warning "installing WinFsp failed (attempt $attempt/$maxAttempts): $_; retrying in ${delay}s..."
                Start-Sleep -Seconds $delay
              }
            }
          }

          Install-WinFsp
          Install-WingetPackage 'GnuWin32.Zip'

          echo "CPATH=C:\Program Files\WinFsp\inc\fuse;C:\Program Files (x86)\WinFsp\inc\fuse" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          # winget doesn't reliably add an installed package's directory to
          # PATH the way choco's shims did — add GnuWin32's bin explicitly
          # so `zip` stays resolvable.
          "C:\Program Files (x86)\GnuWin32\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        if: matrix.job_name == 'windows_amd64'

      - name: Print Go version and environment
        shell: bash
        run: |
          printf "Using go at: $(which go)\n"
          printf "Go version: $(go version)\n"
          printf "\n\nGo environment:\n\n"
          go env
          printf "\n\nSystem environment:\n\n"
          env

      # forgego's testing workflow runs the full suite on Linux
      - name: Run unit tests (short, race)
        shell: bash
        env:
          GOFLAGS: -race
        run: |
          go tool -modfile=.forgego/task/go.mod task test:short
        if: inputs.release_tag == ''

      - name: Build
        shell: bash
        run: |
          CGO_ENABLED=1 GOOS=${{ matrix.go_os || 'linux' }} GOARCH=${{ matrix.go_arch || 'amd64' }} go tool -modfile=.forgego/task/go.mod task build
      
      # the release build runs in the same workflow run, where these names are already taken
      - name: Upload artifacts
        if: inputs.release_tag == ''
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: build-${{ matrix.job_name }}
          path: bin/*

      # release-please's tags are created with GITHUB_TOKEN, which starts no workflow, so the
      # pipeline calls this again with release_tag once it publishes a release
      - name: Release
        uses: softprops/action-gh-release@v3
        if: inputs.release_tag != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ inputs.release_tag }}
          files: |
            bin/*
            LICENSE

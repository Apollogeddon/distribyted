---
name: build

# Trigger the workflow on push or pull request
on: workflow_call

jobs:
  build:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        job_name: ['linux_amd64', 'mac', 'windows_amd64']

        include:
          - job_name: linux_amd64
            os: ubuntu-latest
            go_os: linux
            go_arch: amd64

          - job_name: mac
            os: macos-latest
            go_os: darwin
            go_arch: amd64

          - job_name: windows_amd64
            os: windows-latest
            go_os: windows
            go_arch: amd64
          
    name: ${{ matrix.job_name }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install Libraries on Linux
        shell: bash
        run: |
          sudo modprobe fuse
          sudo chmod 666 /dev/fuse
          sudo chown root:$USER /etc/fuse.conf
          sudo apt-get install fuse libfuse-dev rpm pkg-config
        if: startsWith(matrix.job_name, 'linux')

      - name: Install Libraries on macOS
        shell: bash
        run: |
          brew update
          brew install --cask macfuse
        if: matrix.job_name == 'mac'

      - name: Install Libraries on Windows
        shell: powershell
        run: |
          $ProgressPreference = 'SilentlyContinue'

          function Install-WingetPackage($id) {
            $maxAttempts = 5
            for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
              # --exact avoids winget's fuzzy id matching picking an
              # unrelated/beta package (e.g. WinFsp.WinFsp.Beta) instead of
              # the pinned id below.
              winget install --exact --id $id --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity
              if ($LASTEXITCODE -eq 0) { return }
              if ($attempt -eq $maxAttempts) {
                Write-Error "winget install $id failed after $maxAttempts attempts (exit $LASTEXITCODE)"
                exit $LASTEXITCODE
              }
              $delay = 10 * $attempt
              Write-Warning "winget install $id failed (attempt $attempt/$maxAttempts, exit $LASTEXITCODE); retrying in ${delay}s..."
              Start-Sleep -Seconds $delay
            }
          }

          Install-WingetPackage 'WinFsp.WinFsp'
          Install-WingetPackage 'GnuWin32.Zip'

          echo "CPATH=C:\Program Files\WinFsp\inc\fuse;C:\Program Files (x86)\WinFsp\inc\fuse" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          # winget doesn't reliably add an installed package's directory to
          # PATH the way choco's shims did — add GnuWin32's bin explicitly
          # so `zip` stays resolvable.
          "C:\Program Files (x86)\GnuWin32\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          # Copy mingw32-make.exe to make.exe so the same command line
          # can be used on Windows as on macOS and Linux
          $path = (get-command mingw32-make.exe).Path
          Copy-Item -Path $path -Destination (Join-Path (Split-Path -Path $path) 'make.exe')
        if: matrix.job_name == 'windows_amd64'

      - name: Print Go version and environment
        shell: bash
        run: |
          printf "Using go at: $(which go)\n"
          printf "Go version: $(go version)\n"
          printf "\n\nGo environment:\n\n"
          go env
          printf "\n\nSystem environment:\n\n"
          env

      - name: Run unit tests (short, race)
        shell: bash
        run: |
          make test-short

      - name: Run integration tests (race)
        shell: bash
        run: |
          make test-race
        if: matrix.job_name == 'linux_amd64'

      - name: Convert coverage.out to coverage.lcov
        uses: jandelgado/gcov2lcov-action@v1.2.0
        if: matrix.job_name == 'linux_amd64'
      - name: Coveralls
        uses: coverallsapp/github-action@v2.3.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: coverage.lcov
        if: matrix.job_name == 'linux_amd64'

      - name: Build
        shell: bash
        run: |
          CGO_ENABLED=1 GOOS=${{ matrix.go_os }} GOARCH=${{ matrix.go_arch }} make build
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: build-${{ matrix.job_name }}
          path: bin/*

      - name: Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: bin/*

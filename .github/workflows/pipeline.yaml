name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    - cron: '26 14 * * 1' # Weekly scan

# read-only unless a job asks for more; the build runs the pull request's own code
permissions:
  contents: read

jobs:
  # forgego's checks: Gitleaks, OSV-Scanner, govulncheck, forgego sync-check, go mod tidy,
  # golangci-lint fmt and run. cgofuse needs the FUSE headers to compile.
  quality:
    name: Quality
    uses: apollogeddon/forgego/.github/workflows/quality.yml@main
    with:
      apt_packages: fuse libfuse-dev pkg-config
    permissions:
      contents: read
      pull-requests: read # Gitleaks lists a pull request's commits

  codeql:
    name: CodeQL
    needs: [quality]
    uses: ./.github/workflows/codeql-analysis.yml
    permissions:
      actions: read
      contents: read
      security-events: write

  build:
    name: Build & Test
    uses: ./.github/workflows/build.yaml

  # forgego's auto-merge: once the build and its tests pass, merges a Dependabot pull request
  # (any update but a GitHub Actions one, which waits for a person)
  auto-merge:
    name: Auto-merge
    needs: [build, codeql]
    if: github.event_name == 'pull_request'
    uses: apollogeddon/forgego/.github/workflows/merge.yml@main
    permissions:
      contents: write
      pull-requests: write

  release:
    name: Release
    needs: [build, codeql]
    # forgego's release-please: opens release pull requests and publishes releases from main
    # only; on pull requests and the weekly scan it has nothing to do
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: apollogeddon/forgego/.github/workflows/version.yml@main
    permissions:
      contents: write
      pull-requests: write

  release-binaries:
    name: Release binaries
    needs: [release]
    if: needs.release.outputs.new_release_published == 'true'
    uses: ./.github/workflows/build.yaml
    with:
      release_tag: ${{ needs.release.outputs.tag_name }}
    permissions:
      contents: write

  docker:
    name: Docker Build & Push
    needs: [build, release]
    if: needs.release.outputs.new_release_published == 'true'
    uses: ./.github/workflows/docker.yaml
    with:
      version: ${{ needs.release.outputs.tag_name }}
    permissions:
      contents: read
      packages: write
      security-events: write

  # The documentation site in docs/, a forgego --website module. Pull requests build it;
  # every push to main deploys it to GitHub Pages.
  pages:
    name: Docs
    uses: apollogeddon/forgego/.github/workflows/website.yml@main
    with:
      working_directory: 'docs'
      enable_versioning: false
      enable_secrets: false
      # the auto-merge job above merges Dependabot PRs
      auto_merge: false
      artifact_name: 'pages-dist'
    permissions:
      contents: write
      id-token: write
      pages: write
      pull-requests: write

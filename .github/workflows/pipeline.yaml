name: CI/CD Pipeline

on:
  push:
    branches: [ master ]
    tags: [ '*' ]
  pull_request:
  schedule:
    - cron: '26 14 * * 1' # Weekly scan

jobs:
  # forgego's checks: Gitleaks, OSV-Scanner, govulncheck, forgego sync-check, go mod tidy,
  # golangci-lint fmt and run. cgofuse needs the FUSE headers to compile.
  quality:
    name: Quality
    uses: apollogeddon/forgego/.github/workflows/quality.yml@main
    with:
      system_packages: fuse libfuse-dev pkg-config

  codeql:
    name: CodeQL
    needs: [quality]
    uses: ./.github/workflows/codeql-analysis.yml
    permissions:
      actions: read
      contents: read
      security-events: write

  build:
    name: Build & Test
    uses: ./.github/workflows/build.yaml

  release:
    name: Release
    needs: [build, codeql]
    uses: ./.github/workflows/release-please.yaml
    permissions:
      contents: write
      pull-requests: write

  docker:
    name: Docker Build & Push
    needs: [build, release]
    if: needs.release.outputs.release_created == 'true'
    uses: ./.github/workflows/docker.yaml
    with:
      version: ${{ needs.release.outputs.tag_name }}
    permissions:
      contents: read
      packages: write
      security-events: write
name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    - cron: '26 14 * * 1' # Weekly scan

# read-only unless a job asks for more; the build runs the pull request's own code
permissions:
  contents: read

jobs:
  # forgego's service workflow. Its testing workflow runs the checks (Gitleaks, OSV-Scanner,
  # govulncheck, forgego sync-check, go mod tidy, golangci-lint fmt and run), the full test suite
  # with the race detector and the build on Linux, and the short tests and the build on macOS and
  # Windows; on main its patch job commits `task sync` after a Dependabot bump of forgego and
  # upgrades the modules govulncheck finds vulnerable. Then auto-merge of Dependabot's pull
  # requests (but GitHub Actions updates), release-please, and on a release the binaries.
  service:
    name: Service
    uses: apollogeddon/forgego/.github/workflows/service.yml@main
    with:
      # cgofuse compiles against the FUSE headers on Linux, and the setup script installs macFUSE
      # on macOS and WinFsp on Windows
      apt_packages: fuse libfuse-dev pkg-config
      setup_script: .github/setup/setup.sh
      artifact_name: build
      artifact_path: bin
      # Windows builds without cgo, as cgofuse loads WinFsp at run time, so its tests check the
      # build that's released
      extra_runners: >-
        [{"runs_on": "macos-latest", "name": "mac"},
         {"runs_on": "windows-latest", "name": "windows_amd64", "env": {"CGO_ENABLED": "0"}}]
      extra_test_task: test:short
      # GoReleaser cross-compiles on Linux, which cgo can't for macOS, so each platform builds on
      # its own runner, and the binaries and LICENSE are attached to the draft before it's published
      release_binaries: false
      native_builds: >-
        [{"runs_on": "ubuntu-latest", "name": "linux_amd64"},
         {"runs_on": "macos-latest", "name": "mac", "env": {"GOARCH": "amd64", "CGO_ENABLED": "1"}},
         {"runs_on": "windows-latest", "name": "windows_amd64", "env": {"CGO_ENABLED": "0"}}]
      release_files: LICENSE
      checksums: ''
    permissions:
      contents: write # release-please, the release, and the patch job's push to main
      pull-requests: write # release and Dependabot pull requests; Gitleaks lists a pull request's commits

  # forgego's docker workflow, with QEMU as build/Dockerfile compiles cgofuse in each target
  # platform's own image. Every run builds the image, so a broken Dockerfile fails the checks;
  # only a release pushes it. Runs that don't push build linux/amd64 alone, as emulating arm64
  # takes far longer.
  docker:
    name: Docker Build & Push
    needs: [service]
    uses: apollogeddon/forgego/.github/workflows/docker.yml@main
    with:
      push: ${{ needs.service.outputs.new_release_published == 'true' }}
      version: ${{ needs.service.outputs.tag_name }}
      platforms: ${{ needs.service.outputs.new_release_published == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
      dockerfile: build/Dockerfile
      qemu: true
      build_args: BUILD=${{ github.sha }}
      tags: |
        type=ref,event=branch
        type=semver,pattern={{version}},value=${{ needs.service.outputs.tag_name }}
        type=semver,pattern={{major}}.{{minor}},value=${{ needs.service.outputs.tag_name }}
        type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
        type=sha,format=long,prefix=
    permissions:
      contents: read
      packages: write

  # The documentation site in docs/, a forgego --website module. Pull requests build it;
  # every push to main deploys it to GitHub Pages.
  pages:
    name: Docs
    uses: apollogeddon/forgego/.github/workflows/website.yml@main
    with:
      working_directory: 'docs'
      enable_versioning: false
      enable_secrets: false
      # the service job above merges Dependabot PRs
      auto_merge: false
      artifact_name: 'pages-dist'
    permissions:
      contents: write
      id-token: write
      pages: write
      pull-requests: write

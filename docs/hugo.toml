baseURL = "https://apollogeddon.github.io/distribyted/"
title = "distribyted"
locale = "en"
enableGitInfo = false

[module]
  [[module.imports]]
    path = "github.com/imfing/hextra"

[markup.goldmark.renderer]
  unsafe = false

[menu]
  [[menu.main]]
    name = "Docs"
    pageRef = "/docs"
    weight = 1
  [[menu.main]]
    name = "Search"
    weight = 2
    [menu.main.params]
      type = "search"
  [[menu.main]]
    name = "GitHub"
    url = "https://github.com/Apollogeddon/distribyted"
    weight = 3
    [menu.main.params]
      icon = "github"

[params]
  description = "Torrent client with on-demand file downloading as a virtual filesystem."

[params.navbar]
  displayTitle = true
  displayLogo = true
  [params.navbar.logo]
    path = "images/distribyted_icon.png"
    width = "28"
    height = "28"

[params.footer]
  displayPoweredBy = false
